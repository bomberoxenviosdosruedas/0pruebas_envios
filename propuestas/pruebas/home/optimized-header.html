<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OptimizedHeader — Envíos DosRuedas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Bebas+Neue&family=Geist+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-brand-blue-50: #E6EEFE;
      --color-brand-blue-100: #BACEFD;
      --color-brand-blue-200: #8EAFFB;
      --color-brand-blue-300: #628FF9;
      --color-brand-blue-400: #3570F8;
      --color-brand-blue-500: #0950F6;
      --color-brand-yellow-50: #FFFDE6;
      --color-brand-yellow-100: #FFFAB8;
      --color-brand-yellow-200: #FFF78A;
      --color-brand-yellow-300: #FFF45C;
      --color-brand-yellow-400: #FFF12E;
      --color-brand-yellow-500: #FFEC01;
      --color-brand-yellow-600: #E6D400;
      --color-white: #FFFFFF;
      --font-sans: "Outfit", sans-serif;
      --font-display: "Anton SC", "Anton", sans-serif;
      --font-subheading: "Bebas Neue", sans-serif;
      --font-mono: "Geist Mono", monospace;
      --ease-out-ui: cubic-bezier(0.23, 1, 0.32, 1);
      --duration-feedback: 160ms;
      --shadow-elevated: 0 16px 40px rgba(9, 80, 246, 0.18);
      --shadow-cta-glow: 0 0 28px rgba(255, 236, 1, 0.45), 0 8px 24px rgba(9, 80, 246, 0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--color-brand-blue-50); min-height: 150vh; color: var(--color-brand-blue-500); }
    .font-sans { font-family: var(--font-sans); }
    .font-display { font-family: var(--font-display); text-transform: uppercase; letter-spacing: -0.025em; }
    .font-subheading { font-family: var(--font-subheading); text-transform: uppercase; letter-spacing: 0.05em; }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    header#optimized-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      width: 100%;
      color: var(--color-white);
      background-color: var(--color-brand-blue-500);
      padding: 1rem 0;
      border-bottom: 1px solid transparent;
      transition: background-color 0.3s ease, padding 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    header#optimized-header.scrolled {
      background-color: rgba(9, 80, 246, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-elevated);
      border-bottom-color: rgba(255, 255, 255, 0.1);
      padding: 0.625rem 0;
    }

    .header-inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    @media (min-width: 640px) { .header-inner { padding: 0 1.5rem; } }
    @media (min-width: 1024px) { .header-inner { padding: 0 2rem; } }

    /* Logo Textual Tipográfico (sin SVG de imagen) */
    .brand-logo-text {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--color-white);
      user-select: none;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.025em;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 640px) {
      .brand-title {
        flex-direction: row;
        gap: 0.35rem;
        font-size: 1.875rem;
      }
    }
    .brand-title-yellow {
      color: var(--color-brand-yellow-500);
    }

    /* Desktop Navigation */
    .desktop-nav {
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    @media (min-width: 1024px) {
      .desktop-nav { display: flex; }
    }

    .nav-item-wrapper {
      position: relative;
    }

    .nav-link, .nav-dropdown-btn {
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-family: var(--font-subheading);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: var(--color-white);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      transition: all var(--duration-feedback) var(--ease-out-ui);
    }
    .nav-link:hover, .nav-dropdown-btn:hover {
      color: var(--color-brand-yellow-500);
      background-color: rgba(0, 0, 0, 0.15);
    }
    .nav-link.active, .nav-dropdown-btn.active {
      color: var(--color-brand-yellow-500);
      background-color: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 236, 1, 0.3);
    }

    .chevron-icon {
      width: 1rem;
      height: 1rem;
      transition: transform 0.2s ease;
    }
    .nav-item-wrapper:hover .chevron-icon,
    .nav-dropdown-btn[aria-expanded="true"] .chevron-icon {
      transform: rotate(180deg);
    }

    /* Dropdown Menus */
    .dropdown-panel {
      position: absolute;
      top: 100%;
      left: 0;
      padding-top: 0.5rem;
      width: 16rem;
      z-index: 50;
      display: none;
      transform-origin: top left;
      animation: dropdownEnter 0.2s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-item-wrapper:hover .dropdown-panel,
    .nav-item-wrapper:focus-within .dropdown-panel {
      display: block;
    }

    @keyframes dropdownEnter {
      from { opacity: 0; transform: translateY(4px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dropdown-card {
      background-color: var(--color-brand-blue-500);
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.625rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .dropdown-sublink {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      color: var(--color-white);
      font-family: var(--font-subheading);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
      transition: all var(--duration-feedback) var(--ease-out-ui);
    }
    .dropdown-sublink:hover {
      color: var(--color-brand-yellow-500);
      background-color: rgba(0, 0, 0, 0.15);
    }
    .dropdown-sublink-icon {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.5rem;
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--color-brand-blue-50);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s, color 0.2s;
    }
    .dropdown-sublink:hover .dropdown-sublink-icon {
      background-color: var(--color-brand-yellow-500);
      color: var(--color-brand-blue-500);
    }
    .dropdown-sublink-icon svg {
      width: 1rem;
      height: 1rem;
      stroke-width: 2.2;
    }

    /* Actions Rigth (Teléfono + Cotizador) */
    .header-actions-desktop {
      display: none;
      align-items: center;
      gap: 1.25rem;
    }
    @media (min-width: 1024px) {
      .header-actions-desktop { display: flex; }
    }

    .phone-link-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-white);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      transition: color var(--duration-feedback) var(--ease-out-ui);
    }
    .phone-link-header:hover { color: var(--color-brand-yellow-500); }
    .phone-link-header svg { width: 1rem; height: 1rem; color: var(--color-brand-yellow-500); }

    /* CTA Nested Pill Outline (Header version) */
    .cta-pill-header {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-radius: 9999px;
      font-family: var(--font-subheading);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      padding: 0.5rem 1.25rem;
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: var(--color-white);
      transition: all var(--duration-feedback) var(--ease-out-ui);
    }
    .cta-pill-header:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--color-white);
    }
    .cta-pill-icon {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-brand-yellow-500);
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }
    .cta-pill-header:hover .cta-pill-icon {
      background-color: var(--color-brand-yellow-500);
      color: var(--color-brand-blue-500);
      transform: translateX(3px);
    }

    /* Mobile Header Controls */
    .mobile-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    @media (min-width: 1024px) {
      .mobile-controls { display: none; }
    }

    .btn-mobile-round {
      width: 44px;
      height: 44px;
      border-radius: 0.75rem;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--color-white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-mobile-round:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--color-brand-yellow-500);
    }
    .btn-mobile-round svg { width: 1.25rem; height: 1.25rem; }
  </style>
</head>

  <script>
    (function () {
      const header = document.getElementById('optimized-header');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      }, { passive: true });
    })();
  </script>
